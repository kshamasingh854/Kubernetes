# deployment use with PVC

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mydv
  template:
    metadata:
      labels:
        app: mydv
    spec:
      containers:
        - name: c1
          image: centos
          command: ["/bin/bash", "-c", "while true; do echo Kshama; sleep 5; done"]
          volumeMounts:
            - name: mypd
              mountPath: "/tmp/Kshama"
      volumes:
        - name: mypd
          persistentVolumeClaim:
            claimName: mypvc

:wq


