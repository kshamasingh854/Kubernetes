*secret provide you with a mechanism to use such information in a safe and reliable way with the following properties %
*The API server stores secrets as plaintext in etcd.
*You can access via a volume or an envirment variable from a continue running in a Pod
*secrets can be Created:--
1)from a text file 
2)from a yml file 


echo "root"> username.text; echo "Admin@123passwd"> passwd.text
cat username.text
cat passwd.text
kubectl create secret generic mysecret --from-file=username.text --from-file=passwd.text
kubectl get secret
kubectl describe secret <secret_name>


#vim secret.yml
apiVersion: v1
kind: Pod
metadata:
   name: mysecret

spec:
  containers:
     - name: c1
       image: ubuntu
       command: ["/bin/bash", "-c", "while true; do echo Kshama; sleep 5; done"]
       volumeMounts:
          - name: testsecret
            mountPath: "/tmp/mysecret"
  volumes:
    - name: testsecret
      secret:
         secretName: mysecret

:wq

kubectl apply -f secret.yml
kubectl get pods
kubectl exec <pod_name> -c <container name> -- /bin/bash
cd /tmp/mysecret
ls
will show files and content
