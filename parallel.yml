
apiVersion: batch/v1
kind: Job
metadata:
  name: testpod
spec:
  parallelism: 5  #craeat and run pods in paralleli
  activeDeadlineSeconds: 10      #timeout after 10 sec (delete kr dega)
  template:
    metadata:
      labels:
        app: testpod
    spec:
      containers:
        - name: c1
          image: ubuntu
          command: ["/bin/bash", "-c", "while true; do echo singh; sleep 5; done"]
      restartPolicy: Never
:wq

kubectl apply -f parallel.yml
kubectl get jobs
kubectl get pods
kubectl describe job testpod
kubectl get job testpod -o wide

*USING JOB WE CAN DO PERLALY CREATE POD AND DELETE:-
*Job = run tasks to completion; Deployment = keep applications running.


