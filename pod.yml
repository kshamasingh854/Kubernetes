
apiVersion: v1
kind: Pod
metadata:
  name: testpod
  annotations:
    description: "This is our first pod creation"

spec:
  containers:
    - name: c00
      image: ubuntu
      command: ["/bin/bash", "-c", "while true; do echo kshama singh; sleep 5; done"]

    - name: c001
      image: ubuntu
      command: ["/bin/bash", "-c", "while true; do echo kshama singh rajput; sleep 5; done"]
      ports:
        - containerPort: 80
      env:
       - name: Myname
         value: kshsingh
:wq

