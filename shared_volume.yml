apiVersion: v1
kind: Pod
metadata:
  name: test
spec:
  initContainers:
    - name: c1
      image: ubuntu
      command: ["/bin/bash", "-c", "mkdir -p /tmp/kshama && echo 'this is testing file for init containers' > /tmp/kshama/data"]
      volumeMounts:
        - name: mount
          mountPath: "/tmp/kshama"

  containers:
    - name: c2
      image: ubuntu
      command: ["/bin/bash", "-c", "while true; do echo 'hi kshama singh' > /tmp/kshama/data; sleep 5; done"]
      volumeMounts:
        - name: mount
          mountPath: "/tmp/kshama"

  volumes:
    - name: mount
      emptyDir: {}

:wq

kubectl apply -f shared_volume.yml
kubectl get pods
kubectl describe pods <pod_name
kubectl logs -f pod/i
