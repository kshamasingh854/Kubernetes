# testing for limit and resource request

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeployment
spec:
  replicas: 3
  selector:
    matchLabels:
      name: Kshama
  template:
    metadata:
      labels:
        name: Kshama
    spec:
      containers:
        - name: c1
          image: ubuntu
          command: ["/bin/bash", "-c", "while true; do echo ksham; sleep 5; done"]
          resources:
            requests:
              cpu: "200m"

